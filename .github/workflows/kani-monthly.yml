name: Kani snapshot

# Builds, attests, validates and publishes an immutable Kani snapshot.
#
# Every job is guarded by the canonical repository, the main ref and a trusted
# event, and the whole run is serialized so revision allocation cannot race.
# The build compiles upstream source; the jobs that sign and publish never see
# that source or run anything from it.
#
# A schedule is disabled unless `KANI_SNAPSHOTS_ENABLED` is `true`. A manual
# run always creates a build attestation with OIDC, even when `publish` is
# false and no release is created.

on:
  schedule:
    - cron: "23 4 3 * *"
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: Full 40-hex upstream commit to build (must be the pinned commit).
        required: true
        type: string
      publication_id:
        description: Immutable tag, `kani-snapshot-YYYY-MM-<12 hex>-rN`.
        required: true
        type: string
      publish:
        description: Publish the release after validation. An attestation is always created.
        required: false
        default: false
        type: boolean

concurrency:
  group: kani-snapshot-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  PYTHON_VERSION: "3.14"
  UPSTREAM_REPOSITORY: model-checking/kani

jobs:
  guard:
    name: Check the run is trusted
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      trusted: ${{ steps.guard.outputs.trusted }}
    steps:
      - name: Refuse an untrusted run
        id: guard
        env:
          CANONICAL_REPOSITORY: leynos/rust-prover-tools
          SNAPSHOTS_ENABLED: ${{ vars.KANI_SNAPSHOTS_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "$CANONICAL_REPOSITORY" ]]; then
            echo "snapshot runs are only trusted in $CANONICAL_REPOSITORY" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "snapshot runs are only trusted from refs/heads/main, not $GITHUB_REF" >&2
            exit 1
          fi
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch) ;;
            *)
              echo "snapshot runs are only trusted for schedule and workflow_dispatch" >&2
              exit 1
              ;;
          esac
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$SNAPSHOTS_ENABLED" != "true" ]]; then
            echo "scheduled snapshots are disabled: set the KANI_SNAPSHOTS_ENABLED variable" >&2
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "trusted=true" >> "$GITHUB_OUTPUT"

  resolve:
    name: Resolve the upstream commit and its identity
    needs: guard
    # Every guarded job names the guard's result as well as its output. An
    # ordinary comparison keeps the implicit success() check on `needs`, so a
    # failed guard already stops this job; the named result states that
    # rather than leaving it to the default.
    if: |
      needs.guard.result == 'success' &&
      needs.guard.outputs.trusted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Reading the release list is read-only work: the identity is allocated
    # from the identities this repository has already published. A draft left
    # by an interrupted run is invisible here and is refused by the publish
    # job, which holds the writer token and re-observes before it writes.
    permissions:
      contents: read
    outputs:
      upstream_commit: ${{ steps.resolution.outputs.upstream_commit }}
      tag: ${{ steps.resolution.outputs.tag }}
    steps:
      - name: Check out the builder at the recorded commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      - name: Install the producer
        run: uv sync --frozen --no-dev
      - name: Collect the existing releases
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run --frozen --no-dev python -m \
            rust_prover_tools.kani_snapshot.orchestrator.collect_releases \
            --output producer/releases.json
      - name: Collect upstream evidence
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run --frozen --no-dev python -m \
            rust_prover_tools.kani_snapshot.orchestrator.collect_candidates \
            --output producer/candidates.json
      - name: Collect the dispatched commit's checks
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
        run: |
          set -euo pipefail
          uv run --frozen --no-dev python -m \
            rust_prover_tools.kani_snapshot.orchestrator.collect_candidates \
            --commit "$UPSTREAM_COMMIT" \
            --output producer/checks.json
      - name: Resolve the upstream commit
        id: resolution
        env:
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
        run: |
          set -euo pipefail
          route=(--route scheduled --candidates producer/candidates.json)
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            route=(--route manual --commit "$UPSTREAM_COMMIT" --checks producer/checks.json)
          fi
          uv run --frozen --no-dev python -m \
            rust_prover_tools.kani_snapshot.orchestrator.entrypoint resolve \
            "${route[@]}" \
            --output producer/resolution.json \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "upstream_commit=$(jq -r .upstream_commit producer/resolution.json)" >> "$GITHUB_OUTPUT"
      - name: Allocate the publication identity
        id: identity
        env:
          PUBLICATION_ID: ${{ inputs.publication_id }}
        run: |
          set -euo pipefail
          identity=(--month "$(date -u +%Y-%m)" --releases producer/releases.json)
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # The dispatched tag already names its month; the producer derives
            # it from the tag, so passing one here could only contradict it.
            identity=(--publication-id "$PUBLICATION_ID")
          fi
          uv run --frozen --no-dev python -m \
            rust_prover_tools.kani_snapshot.orchestrator.entrypoint identity \
            --resolution producer/resolution.json \
            --builder-commit "$GITHUB_SHA" \
            "${identity[@]}" \
            --output producer/identity.json \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "tag=$(jq -r .tag producer/identity.json)" >> "$GITHUB_OUTPUT"
      - name: Upload the resolution and identity
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: kani-snapshot-resolution-${{ github.run_id }}-${{ github.run_attempt }}
          path: producer/
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build the upstream payloads
    needs: [guard, resolve]
    # An ordinary comparison keeps the implicit success() check, and the
    # dependency's own result is named as well: a failed resolve must not
    # reach a build that would then download nothing, and a job deliberately
    # allowed to run after a failure would still see which outcomes it takes.
    if: |
      needs.guard.outputs.trusted == 'true' &&
      needs.resolve.result == 'success'
    # The recipe's builder image: its glibc is the published runtime floor.
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the builder at the recorded commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: builder
          persist-credentials: false
      - name: Check out the resolved upstream commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.upstream_commit }}
          path: upstream
          submodules: recursive
          persist-credentials: false
      - name: Download the resolution and identity
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: kani-snapshot-resolution-${{ github.run_id }}-${{ github.run_attempt }}
          path: producer
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      - name: Install the producer
        working-directory: builder
        run: uv sync --frozen --no-dev
      - name: Derive the pinned build plan
        working-directory: builder
        run: |
          set -euo pipefail
          uv run --frozen --no-dev python -m \
            rust_prover_tools.kani_snapshot.orchestrator.entrypoint build \
            --resolution ../producer/resolution.json \
            --identity ../producer/identity.json \
            --builder-commit "$GITHUB_SHA" \
            --output ../producer/plan.json \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Install the pinned prerequisite solvers
        env:
          CBMC_URL: https://github.com/diffblue/cbmc/releases/download/cbmc-6.11.0/ubuntu-22.04-cbmc-6.11.0-Linux.deb
          CBMC_SHA256: de9fa1cc4cf51c493e708a1c7608b192ad4956717b684d9c4501e22fd22d88a0
          KISSAT_URL: https://github.com/arminbiere/kissat/archive/refs/tags/rel-4.0.1.tar.gz
          KISSAT_SHA256: 4b41edf12ffa5f8e8b1986e5ad3e0bedb4d34b0ed3ecc7c13362bc7ba0aba66b
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/cbmc.deb" "$CBMC_URL"
          printf '%s  %s\n' "$CBMC_SHA256" "$RUNNER_TEMP/cbmc.deb" | sha256sum -c -
          sudo apt-get install -y "$RUNNER_TEMP/cbmc.deb"

          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/kissat.tar.gz" "$KISSAT_URL"
          printf '%s  %s\n' "$KISSAT_SHA256" "$RUNNER_TEMP/kissat.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/kissat-src"
          tar -xzf "$RUNNER_TEMP/kissat.tar.gz" -C "$RUNNER_TEMP/kissat-src" --strip-components=1
          # The release archive carries `configure` and `makefile.in`; there is
          # no ready Makefile, so the build directory must be generated first.
          (
            cd "$RUNNER_TEMP/kissat-src"
            ./configure
            make -j"$(nproc)"
          )
          sudo install -m 0755 "$RUNNER_TEMP/kissat-src/build/kissat" /usr/local/bin/kissat
      - name: Download the pinned Rust channel metadata
        env:
          TOOLCHAIN_CHANNEL: nightly-2026-08-21
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/channel-rust-nightly.toml"
          curl -fsSL --proto '=https' --tlsv1.2 \
            -o "$manifest" \
            "https://static.rust-lang.org/dist/${TOOLCHAIN_CHANNEL#nightly-}/channel-rust-nightly.toml"
      - name: Build the upstream payloads
        working-directory: upstream
        env:
          TOOLCHAIN_CHANNEL: nightly-2026-08-21
          UPSTREAM_COMMIT: ${{ needs.resolve.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          jq -r '.commands[] | @sh' ../producer/plan.json > "$RUNNER_TEMP/plan-commands.sh"

          upstream_dir="$GITHUB_WORKSPACE/upstream"

          # The resolved checkout is the build input, so its identity before and
          # after the build must agree. A command that rewrote a lockfile or a
          # submodule would otherwise be recorded as if it had built the pinned
          # tree. `--untracked-files=no` keeps build output out of the
          # comparison; ignored paths never appear in either state.
          source_state() {
            git -C "$upstream_dir" rev-parse HEAD
            git -C "$upstream_dir" submodule status --recursive
            git -C "$upstream_dir" status --porcelain --untracked-files=no
          }
          source_state > "$RUNNER_TEMP/source-before.txt"
          # Preserve the input observation immediately: a build that fails
          # later still leaves the tree it built from inspectable, and the
          # failure-path upload below picks this copy up.
          cp "$RUNNER_TEMP/source-before.txt" "$GITHUB_WORKSPACE/producer/"

          # A clean input is established before anything runs. Comparing the
          # before and after states alone would accept a tree that was already
          # dirty and stayed that way.
          head="$(git -C "$upstream_dir" rev-parse HEAD)"
          test "$head" = "$UPSTREAM_COMMIT" || {
            echo "the checkout resolved to $head, not the resolved commit $UPSTREAM_COMMIT" >&2
            exit 1
          }
          dirty="$(git -C "$upstream_dir" status --porcelain --untracked-files=no)"
          test -z "$dirty" || {
            echo "the checked-out source tree is not clean:" >&2
            printf '%s\n' "$dirty" >&2
            exit 1
          }

          # The recipe's submodule gitlinks are checked against what this
          # checkout actually carries. `git submodule status` prefixes a clean
          # submodule with a space and a rewritten, missing or conflicted one
          # with a flag, so any other prefix is refused rather than stripped:
          # an uninitialised or rewritten submodule is not the pinned tree.
          : > "$RUNNER_TEMP/submodule-args"
          while IFS= read -r line; do
            case "$line" in
              " "*) ;;
              *)
                echo "submodule is not at its recorded commit: $line" >&2
                exit 1
                ;;
            esac
            sha="$(printf '%s' "$line" | cut -c2-41)"
            path="$(printf '%s' "$line" | cut -c43- | sed -E 's/ \(.*\)$//')"
            printf -- '--submodule\n%s=%s\n' "$path" "$sha" >> "$RUNNER_TEMP/submodule-args"
          done < <(git -C "$upstream_dir" submodule status --recursive)

          started="$(date +%s)"
          printf '%s\n' "$(df -B1 --output=used -- "$PWD" | tail -1)" > "$RUNNER_TEMP/disk-usage"
          ( while sleep 15; do df -B1 --output=used -- "$PWD" | tail -1 >> "$RUNNER_TEMP/disk-usage"; done ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          status=0
          bash -euo pipefail "$RUNNER_TEMP/plan-commands.sh" || status=$?
          kill "$sampler" 2>/dev/null || true
          trap - EXIT

          # The observations are written whether or not the build succeeded.
          # A failed build is exactly when its wall time, disk use and final
          # source state explain the failure, and the failure-path artefact and
          # run summary read these files. The exit status is re-raised below,
          # so nothing downstream can mistake this for a successful build.
          wall_seconds=$(( $(date +%s) - started ))
          baseline="$(head -1 "$RUNNER_TEMP/disk-usage")"
          peak="$(sort -n "$RUNNER_TEMP/disk-usage" | tail -1)"
          disk_high_water_bytes=$(( peak - baseline ))
          echo "wall_seconds=$wall_seconds" >> "$GITHUB_ENV"
          echo "disk_high_water_bytes=$disk_high_water_bytes" >> "$GITHUB_ENV"
          jq -n --argjson wall "$wall_seconds" --argjson disk "$disk_high_water_bytes" \
            '{resources: {wall_seconds: $wall, disk_high_water_bytes: $disk}}' \
            > "$GITHUB_WORKSPACE/producer/resources.json"

          source_state > "$RUNNER_TEMP/source-after.txt"
          # Copy before comparing, so a build that changed its own input still
          # leaves both observations for the failure-path upload.
          cp "$RUNNER_TEMP/source-after.txt" "$GITHUB_WORKSPACE/producer/"
          if [[ "$status" -ne 0 ]]; then
            echo "the planned build commands failed with status $status" >&2
            exit "$status"
          fi
          if ! diff -u "$RUNNER_TEMP/source-before.txt" "$RUNNER_TEMP/source-after.txt"; then
            echo "the build changed the checked-out source tree" >&2
            exit 1
          fi
      - name: Assemble the release payloads
        env:
          KISSAT_SOURCE: ${{ runner.temp }}/kissat-src
        run: |
          set -euo pipefail
          mkdir -p payloads
          bundle_asset="$(jq -r .bundle_asset producer/plan.json)"
          launcher_asset="$(jq -r .launcher_asset producer/plan.json)"
          target="$(jq -r .target producer/plan.json)"
          version="$(
            cd upstream
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "kani-verifier") | .version'
          )"
          notices_asset="kani-${version}-notices-${target}.tar.gz"

          # `cargo bundle` runs `build-kani` as a child of the workspace root,
          # and that tool writes the tarball into its current directory, so the
          # bundle lands in `upstream/`, not in `upstream/target`.
          bundle="upstream/$bundle_asset"
          test -f "$bundle" || {
            echo "the build produced no $bundle_asset in the upstream workspace root" >&2
            exit 1
          }
          cp "$bundle" "payloads/$bundle_asset"

          # The consumer extracts with `--strip-components=1` under a required
          # `kani-<version>/` root and then reads `bin/cargo-kani`, so the
          # launcher archive must carry the same root and `bin` directory as
          # the backend bundle. The binaries come from the plan's locked
          # `cargo install --root target/launcher-prefix`, which is the recipe
          # the design pins, rather than from `target/release`. It is exactly
          # the two documented binaries, packed reproducibly so an unchanged
          # input set yields an unchanged digest.
          bundle_root="kani-${version}"
          launcher_prefix="upstream/target/launcher-prefix"
          launcher_root="$RUNNER_TEMP/launcher-root/$bundle_root"
          mkdir -p "$launcher_root/bin"
          for binary in kani cargo-kani; do
            test -x "$launcher_prefix/bin/$binary" || {
              echo "the locked launcher install produced no $binary" >&2
              exit 1
            }
            install -m 0755 "$launcher_prefix/bin/$binary" "$launcher_root/bin/"
          done
          tar --sort=name --mtime='UTC 2026-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "payloads/$launcher_asset" -C "$RUNNER_TEMP/launcher-root" "$bundle_root"

          # Notices are upstream's own inventory plus the Kissat licence the
          # pinned Kissat tarball carries; nothing else is redistributed.
          mkdir -p "$RUNNER_TEMP/notices"
          cp upstream/tools/build-kani/license-notes.txt \
            "$RUNNER_TEMP/notices/kani-license-notes.txt"
          cp "$KISSAT_SOURCE/LICENSE" "$RUNNER_TEMP/notices/kissat-LICENSE"
          tar --sort=name --mtime='UTC 2026-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "payloads/$notices_asset" -C "$RUNNER_TEMP/notices" .

          # The inventory describes the distributable tree, so it is measured
          # from the extracted bundle rather than from the archive bytes. Its
          # paths are relative to the `kani-<version>/` root, because the
          # consumer strips that root before comparing the inventory with the
          # installed tree.
          mkdir -p "$RUNNER_TEMP/bundle-tree"
          tar -xzf "payloads/$bundle_asset" -C "$RUNNER_TEMP/bundle-tree"
          test -d "$RUNNER_TEMP/bundle-tree/$bundle_root" || {
            echo "the bundle does not carry the $bundle_root root" >&2
            exit 1
          }
          uv --directory "$GITHUB_WORKSPACE/builder" run --frozen --no-dev python -m \
            rust_prover_tools.kani_snapshot.orchestrator.inventory_build \
            --tree "$RUNNER_TEMP/bundle-tree/$bundle_root" \
            --output "$GITHUB_WORKSPACE/payloads/inventory.json"
      - name: Measure the build evidence
        env:
          TOOLCHAIN_CHANNEL: nightly-2026-08-21
        run: |
          set -euo pipefail
          sysroot="$(rustup run "$TOOLCHAIN_CHANNEL" rustc --print sysroot)"
          version="$(
            cd upstream
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "kani-verifier") | .version'
          )"
          solver_args=()
          for solver in kissat cbmc; do
            path="$(find "$RUNNER_TEMP/bundle-tree" \( -type f -o -type l \) -name "$solver" -print -quit)"
            test -n "$path" || { echo "the bundle carries no $solver binary" >&2; exit 1; }
            digest="$(sha256sum "$path" | cut -d' ' -f1)"
            reported="$("$path" --version | head -1 | tr -d '[:space:]')"
            solver_args+=(--solver "$solver=$reported=$digest")
          done
          submodule_args=()
          mapfile -t submodule_args < "$RUNNER_TEMP/submodule-args"
          uv --directory "$GITHUB_WORKSPACE/builder" run --frozen --no-dev python -m \
            rust_prover_tools.kani_snapshot.orchestrator.measure_build \
            --sysroot "$sysroot" \
            --channel-manifest "$RUNNER_TEMP/channel-rust-nightly.toml" \
            --kani-compiler "$GITHUB_WORKSPACE/upstream/target/release/kani-compiler" \
            --backend-version "$version" \
            --launcher-package-version "$version" \
            --upstream-commit "$(jq -r .upstream_commit "$GITHUB_WORKSPACE/producer/plan.json")" \
            --lock "$GITHUB_WORKSPACE/upstream/Cargo.lock" \
            --lock "$GITHUB_WORKSPACE/builder/uv.lock" \
            "${submodule_args[@]}" \
            "${solver_args[@]}" \
            --cache-outcome none \
            --wall-seconds "$wall_seconds" \
            --disk-high-water-bytes "$disk_high_water_bytes" \
            --output "$GITHUB_WORKSPACE/producer/evidence.json"
      - name: Derive the assembly input
        run: |
          set -euo pipefail
          # `uv --directory` changes the child's working directory, so every path
          # passed to this invocation is workspace-absolute.
          uv --directory "$GITHUB_WORKSPACE/builder" run --frozen --no-dev python -m \
            rust_prover_tools.kani_snapshot.orchestrator.build_evidence \
            --plan "$GITHUB_WORKSPACE/producer/plan.json" \
            --evidence "$GITHUB_WORKSPACE/producer/evidence.json" \
            --output "$GITHUB_WORKSPACE/producer/assembly-input.json" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Upload the payloads and evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: kani-snapshot-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            payloads/
            producer/assembly-input.json
            producer/evidence.json
            producer/plan.json
            producer/resources.json
            producer/source-before.txt
            producer/source-after.txt
          if-no-files-found: error
          retention-days: 7
      # A failed build is exactly when its observations matter most. The
      # artefact has its own name, so nothing downstream can mistake a partial
      # observation set for a publishable build.
      - name: Preserve the build observations on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: kani-snapshot-build-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            producer/
            payloads/
          if-no-files-found: ignore
          retention-days: 7
      - name: Summarise the build in the run summary
        if: always()
        run: |
          set -uo pipefail
          summary="$GITHUB_STEP_SUMMARY"
          {
            echo "## Kani snapshot build"
            echo
            echo "| Observation | Value |"
            echo "| --- | --- |"
            echo "| Job result | ${{ job.status }} |"
          } >> "$summary"
          evidence="$GITHUB_WORKSPACE/producer/evidence.json"
          # A failed build never reaches the evidence step, so it has only the
          # resources the observation step recorded before the failure. Both
          # documents are read with the same filter: the measurements are
          # nested under `resources`, and a missing cache outcome means the
          # build failed before one could be recorded.
          if [[ ! -f "$evidence" ]]; then
            evidence="$GITHUB_WORKSPACE/producer/resources.json"
          fi
          if [[ -f "$evidence" ]]; then
            # Reading the measurements at the top level would render `null`
            # while the build itself succeeded.
            jq -r '"| Wall clock (s) | \(.resources.wall_seconds) |",
                   "| Disk high-water (bytes) | \(.resources.disk_high_water_bytes) |",
                   "| Cache outcome | \(.cache.outcome // "not measured") |"' \
              "$evidence" >> "$summary" 2>/dev/null || true
          fi
          for payload in "$GITHUB_WORKSPACE"/payloads/*; do
            [[ -f "$payload" ]] || continue
            printf '| %s | %s bytes |\n' \
              "$(basename "$payload")" "$(wc -c < "$payload")" >> "$summary"
          done
          for state in source-before source-after; do
            recorded="$GITHUB_WORKSPACE/producer/$state.txt"
            [[ -f "$recorded" ]] || continue
            printf '| %s HEAD | %s |\n' "$state" "$(head -1 "$recorded")" >> "$summary"
          done

  assemble:
    name: Assemble the manifest and attest it
    needs: [guard, build]
    # As for the build: the assembly never runs on a failed build, because a
    # partial observation set is not a snapshot. The named result states that
    # in the condition rather than leaving it to the implicit check.
    if: |
      needs.guard.outputs.trusted == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out the builder at the recorded commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the payloads and evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: kani-snapshot-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: build
      # The resolve job's identity is downloaded independently of the build
      # job, so assembly compares the build's metadata with a record the least
      # trusted job never had a chance to rewrite.
      - name: Download the resolution and identity
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: kani-snapshot-resolution-${{ github.run_id }}-${{ github.run_attempt }}
          path: resolution
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      - name: Install the producer
        run: uv sync --frozen --no-dev
      - name: Stage the release directory
        run: |
          set -euo pipefail
          mkdir -p release
          cp build/payloads/* release/
      - name: Assemble the manifest and checksums
        # The build artefact lists `payloads/` and `producer/...`, so the upload
        # action preserves both directory trees relative to their common
        # ancestor and the download lands them under `build/payloads/` and
        # `build/producer/`. The input document is the second of those.
        run: |
          set -euo pipefail
          uv run --frozen --no-dev python -m \
            rust_prover_tools.kani_snapshot.orchestrator.entrypoint assemble \
            --input build/producer/assembly-input.json \
            --identity resolution/identity.json \
            --payloads release \
            --output release \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Attest the manifest
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: release/manifest.json
          show-summary: true
      - name: Record the attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" release/manifest.sigstore.jsonl
      - name: Upload the release directory
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: kani-snapshot-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  validate:
    name: Validate the release on a clean runner
    needs: [guard, assemble]
    if: |
      needs.guard.outputs.trusted == 'true' &&
      needs.assemble.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the builder at the recorded commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the release directory
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: kani-snapshot-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      - name: Install the producer
        run: uv sync --frozen --no-dev
      - name: Verify the manifest and payload bytes
        run: |
          set -euo pipefail
          uv run --frozen --no-dev python -m \
            rust_prover_tools.kani_snapshot.orchestrator.entrypoint validate \
            --manifest release/manifest.json \
            --payloads release \
            --output receipt.json \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Upload the validation receipt
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: kani-snapshot-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipt.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the immutable release
    needs: [guard, validate]
    # A receipt is the only thing that may authorise a publication, so a
    # failed validation cannot fall through to publish.
    if: |
      needs.guard.outputs.trusted == 'true' &&
      needs.validate.result == 'success' &&
      (github.event_name == 'schedule' || inputs.publish == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the builder at the recorded commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the release directory
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: kani-snapshot-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - name: Download the validation receipt
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: kani-snapshot-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      - name: Install the producer
        run: uv sync --frozen --no-dev
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run --frozen --no-dev python -m \
            rust_prover_tools.kani_snapshot.orchestrator.entrypoint publish \
            --manifest release/manifest.json \
            --receipt validation/receipt.json \
            --payloads release \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"