name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check the CV-005 contracts
        run: make test-workflow-contracts
      - name: Install Rust for Merman
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95.0'

      - name: Install Markdown diagram tooling
        run: |
          uv tool install nixie-cli==1.1.0
          cargo +1.95.0 install merman-cli --version '=0.7.0' --locked

      
      - name: Install CLI tools
        run: |
          for tool in mbake; do uv tool install ${tool}; done

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@b50fd9a2b2f2a096d64fe44593805dd2da7f9148
        with:
          version: "0.6.1"

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Check spelling
        run: make spelling

      - name: Validate Mermaid diagrams
        run: make nixie

      - name: Run ruff
        run: make lint

      - name: Run typechecker
        run: make typecheck

      # Workflows are executable policy, so they get a static linter as well as
      # the contract tests `make test` already runs.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          install -m 0755 "$RUNNER_TEMP/actionlint" "$HOME/.local/bin/actionlint"

      - name: Check the workflows
        run: make workflow-check

      # Pull requests measure coverage and ratchet it against the baseline
      # coverage-main.yml writes on main; nothing here talks to CodeScene.
      # A push to main skips this step so that the publisher is the one
      # writer of the baseline, and publish-artefact is off because the
      # report is compared, not published.
      - name: Test and Measure Coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@b50fd9a2b2f2a096d64fe44593805dd2da7f9148
        with:
          language: python
          python-source: ./rust_prover_tools
          output-path: coverage.xml
          format: cobertura
          artefact-name-suffix: rust-prover-tools
          pytest-workers: ''
          with-ratchet: 'true'
          publish-artefact: 'false'
