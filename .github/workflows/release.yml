name: Release Wheels

# Publishes the pure-Python wheel for a `v*.*.*` tag.
#
# The release is created as a draft, every wheel is uploaded and verified
# against the downloaded bytes, and only then is the draft published. A
# published release's assets are immutable, so creating it first — as this
# workflow used to — would leave no way to attach a wheel that failed to
# upload. An interrupted draft is resumed. An already-published release is
# verified and left untouched: it succeeds only if it serves exactly the
# expected wheel set and bytes, and any disagreement is a collision error.

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  # Cancelling here could strand a draft with neither a full asset set nor a
  # reason why, so a later push waits instead of replacing the running job.
  cancel-in-progress: false

permissions: {}

jobs:
  pure-wheel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pure-python-wheel
        with:
          python-version: '3.13'
          artifact-name: wheels-pure

  release:
    # This project has no C or Rust extensions, so cross-platform
    # builds are unnecessary. Only the pure Python wheel is published.
    needs:
      - pure-wheel
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the wheels
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: wheels-pure
          path: dist
      - name: Require a non-empty wheel inventory
        run: |
          set -euo pipefail
          mapfile -d '' wheels < <(find dist -type f -name '*.whl' -print0)
          if [[ ${#wheels[@]} -eq 0 ]]; then
            echo "no wheel was produced; refusing to create a release" >&2
            exit 1
          fi
          printf '%s\n' "${wheels[@]}" | sort > wheel-inventory.txt
          for wheel in "${wheels[@]}"; do basename "$wheel"; done \
            | sort > wheel-names.txt
          # The release serves assets by basename, so the expected set is
          # compared as names; two wheels with one basename would collapse.
          if [[ $(sort -u wheel-names.txt | wc -l) -ne ${#wheels[@]} ]]; then
            echo "the wheel inventory repeats a basename" >&2
            exit 1
          fi
          cat wheel-inventory.txt
      - name: Create the draft or resume it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' \
              > draft-state.txt 2>/dev/null; then
            if [[ "$(cat draft-state.txt)" == "true" ]]; then
              echo "RELEASE_STATE=draft" >> "$GITHUB_ENV"
              echo "resuming the existing draft for $GITHUB_REF_NAME"
            else
              # A published release is recovered as a no-op, never repaired:
              # the upload and publish steps write nothing, and verification
              # below still proves the release serves exactly these bytes. A
              # release that serves anything else is a collision and fails
              # there, so a rerun can neither replace published bytes nor
              # quietly accept a different asset set.
              echo "RELEASE_STATE=published" >> "$GITHUB_ENV"
              echo "release $GITHUB_REF_NAME is already published"
              echo "verifying it as a no-op; published bytes are never replaced"
            fi
          else
            echo "RELEASE_STATE=draft" >> "$GITHUB_ENV"
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --generate-notes \
              --verify-tag \
              --title "$GITHUB_REF_NAME"
          fi
      - name: Upload the missing wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_STATE:-}" == "published" ]]; then
            echo "release $GITHUB_REF_NAME is published; no asset may be added"
            exit 0
          fi
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[].name' | sort > uploaded.txt
          while IFS= read -r wheel; do
            name="$(basename "$wheel")"
            if grep -qxF "$name" uploaded.txt; then
              echo "already uploaded: $name"
            else
              echo "uploading: $name"
              gh release upload "$GITHUB_REF_NAME" "$wheel"
            fi
          done < wheel-inventory.txt
      - name: Verify the complete asset set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf verified
          mkdir -p verified
          gh release download "$GITHUB_REF_NAME" --dir verified --pattern '*.whl'

          find verified -type f -name '*.whl' -printf '%f\n' | sort > downloaded.txt
          if ! diff -u wheel-names.txt downloaded.txt; then
            echo "the release does not serve the expected wheel set" >&2
            exit 1
          fi

          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[].name' | sort > remote.txt
          if ! diff -u wheel-names.txt remote.txt; then
            echo "the release carries assets outside the expected inventory" >&2
            exit 1
          fi

          while IFS= read -r wheel; do
            cmp "$wheel" "verified/$(basename "$wheel")"
          done < wheel-inventory.txt

          if [[ "${RELEASE_STATE:-}" == "published" ]]; then
            echo "the published release serves exactly these bytes; no-op"
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_STATE:-}" == "published" ]]; then
            echo "release $GITHUB_REF_NAME is already published; nothing to publish"
            exit 0
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false