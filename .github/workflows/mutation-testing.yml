name: Mutation testing

# Thin caller of the shared mutation-testing reusable workflow; caller
# guide: leynos/shared-actions docs/mutation-mutmut-workflow.md.
on:
  schedule:
    - cron: "20 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    permissions:
      contents: read
      id-token: write # OIDC workflow-source resolution
    uses: leynos/shared-actions/.github/workflows/mutation-mutmut.yml@5a99aed78ce68dcebd3052b75c31e6f173162b1e
    with:
      # Flat package layout: mutable source lives directly under
      # rust_prover_tools/, so change detection watches that prefix and
      # no path prefix is stripped for module-glob translation.
      paths: "rust_prover_tools/"
      module-prefix-strip: ""
      # Must stay inside pyproject.toml's requires-python: setup-uv exports
      # this as UV_PYTHON for the whole job, and uv refuses to sync a project
      # on an interpreter its range excludes. Omitting it selects the shared
      # workflow's 3.13 default, which this project (>=3.14) rejects.
      python-version: "3.14"
